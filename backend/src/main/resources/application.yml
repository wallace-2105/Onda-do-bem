spring:
  application:
    name: ondadobem-api

  datasource:
    # Supabase Session Pooler IPv4 (porta 5432)
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER:postgres.fljmkiiffvkdciysweme}
    password: ${SUPABASE_DB_PASSWORD:123ondadobem}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Chave secreta de no mínimo 256 bits para assinatura HMAC-SHA256
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 24 horas em milissegundos
    access-token-expiration-ms: 86400000
    # 7 dias em milissegundos
    refresh-token-expiration-ms: 604800000

---
# ==========================================
# PERFIL LOCAL OPCIONAL (H2 Database em arquivo)
# Ative com: --spring.profiles.active=local
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:file:./data/ondadobemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
